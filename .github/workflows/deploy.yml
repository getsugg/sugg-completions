name: Deploy to getsugg.github.io

on:
  push:
    branches: [master]

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: site

    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install sugg
        run: |
          curl -fsSL "https://raw.githubusercontent.com/getsugg/sugg/main/scripts/install.sh" | bash
          echo "$HOME/.sugg/bin" >> $GITHUB_PATH

      - name: Download install scripts for hosting
        run: |
          curl -fsSL "https://raw.githubusercontent.com/getsugg/sugg/main/scripts/install.sh" -o public/install.sh
          curl -fsSL "https://raw.githubusercontent.com/getsugg/sugg/main/scripts/install.ps1" -o public/install.ps1

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      # Type errors don't break the rolldown build (it strips types), so gate
      # them explicitly. Must run after `build`: the generated script data and
      # file-routes types don't exist before it.
      - name: Type check
        run: bun run check

      # Runs the prerendered site in Chrome: routing, hydration, interactions,
      # console diagnostics and layout invariants. Blocks the deploy on failure.
      - name: Smoke test
        run: bun run smoke

      - name: Deploy to getsugg.github.io
        uses: peaceiris/actions-gh-pages@v4
        with:
          deploy_key: ${{ secrets.SSH_DEPLOY_KEY }}
          external_repository: getsugg/getsugg.github.io
          publish_branch: main
          publish_dir: ./site/dist/client
          force_orphan: true
          user_name: github-actions[bot]
          user_email: github-actions[bot]@users.noreply.github.com
